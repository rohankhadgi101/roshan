<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #e9e7e1;
      --card: #f8f7f3;
      --text: #171816;
      --muted: #777870;
      --accent: #9b815b;
      --accent-dark: #806746;
      --line: rgba(23, 24, 22, 0.10);
      --white: #ffffff;
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255,255,255,0.8),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 90%,
          rgba(155,129,91,0.12),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family: "DM Sans", sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;
    }

    /* Mobile phone */
    .phone {
      width: 100%;
      max-width: 420px;
      min-height: 760px;

      background: var(--card);

      border-radius: 34px;

      overflow: hidden;

      position: relative;

      box-shadow:
        0 30px 70px rgba(0,0,0,0.16),
        0 5px 15px rgba(0,0,0,0.08);

      border: 6px solid rgba(255,255,255,0.65);
    }

    /* Decorative background */
    .hero {
      height: 280px;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #1583e9,
          #e2e5ee
        );
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      border-radius: 50%;

      background: rgba(39, 146, 233, 0.28);

      top: -150px;
      right: -100px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      border-radius: 50%;

      background: rgba(91, 121, 155, 0.12);

      bottom: -130px;
      left: -80px;
    }

    /* Logo */
    .logo-container {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      background: rgba(255, 255, 255);

      backdrop-filter: blur(12px);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      position: relative;
      z-index: 2;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.12);

      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .logo {
      width: 128px;
      height: 128px;

      object-fit: contain;
    }

    /* Content */
    .content {
      padding: 0 24px 28px;
      margin-top: -25px;

      position: relative;
      z-index: 5;
    }

    .identity {
      background: var(--card);

      border-radius: var(--radius);

      padding: 25px 20px 22px;

      text-align: center;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.07);
    }

    .brand-name {
      font-family: "Playfair Display", serif;

      font-size: 29px;

      font-weight: 600;

      letter-spacing: -0.5px;

      margin-bottom: 5px;
    }

    .tagline {
      color: var(--muted);

      font-size: 13px;

      letter-spacing: 0.3px;

      line-height: 1.5;
    }

    /* Contact section */
    .section-title {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1.6px;

      color: var(--muted);

      font-weight: 700;

      margin: 26px 3px 10px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .contact-item {
      display: flex;

      align-items: center;

      gap: 13px;

      padding: 13px 15px;

      border: 1px solid var(--line);

      border-radius: 15px;

      background: rgba(255,255,255,0.42);

      text-decoration: none;

      color: var(--text);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .contact-item:hover {
      transform: translateY(-2px);

      background: var(--white);

      box-shadow: 0 8px 20px rgba(0,0,0,0.07);
    }

    .icon i{
        color: #fff;
    }

    .icon {
      width: 38px;
      height: 38px;

      flex-shrink: 0;

      border-radius: 11px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #0e73d1;

      color: var(--accent-dark);

      font-size: 17px;
    }

    .contact-text {
      display: flex;
      flex-direction: column;

      gap: 2px;

      overflow: hidden;
    }

    .contact-label {
      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;

      color: var(--muted);
    }

    .contact-value {
      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* Social links */
    .social-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 9px;
    }

    .social {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 48px;

      border-radius: 14px;

      border: 1px solid var(--line);

      background: rgba(255,255,255,0.45);

      color: var(--text);

      text-decoration: none;

      font-size: 12px;

      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .social:hover {
      transform: translateY(-2px);

      background: var(--text);

      color: white;
    }

    .social span {
      font-size: 15px;
    }

    /* Main CTA */
    .save-button {
      width: 100%;

      border: none;

      background: var(--text);

      color: white;

      padding: 15px;

      border-radius: 15px;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 25px;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .save-button:hover {
      transform: translateY(-2px);

      background: #30312e;

      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .footer {
      text-align: center;

      font-size: 10px;

      color: var(--muted);

      margin-top: 22px;
    }

    /* Small screens */
    @media (max-width: 430px) {
      body {
        padding: 0;
      }

      .phone {
        min-height: 100vh;

        border-radius: 0;

        border: none;

        box-shadow: none;
      }
    }
  </style>
</head>

  <script>

    function saveContact() {

      const contact = {
        name: "Your Brand",
        tel: "+9779800000000",
        email: "hello@yourbrand.com",
        address: "Kathmandu, Nepal"
      };

      const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:${contact.name}
TEL:${contact.tel}
EMAIL:${contact.email}
ADR:;;${contact.address};;;
END:VCARD`;

      const blob = new Blob(
        [vCard],
        { type: "text/vcard" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = `${contact.name}.vcf`;

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

  </script>
